name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure UTF-8 Python output
        shell: pwsh
        run: '"PYTHONUTF8=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib, re
          version = re.search(r'project\(search VERSION ([0-9.]+)', pathlib.Path('CMakeLists.txt').read_text())[1]
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match CMake project version'
          assert pathlib.Path(f'docs/releases/v{version}.md').is_file(), 'Release notes are required'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -QtRoot $env:QT_ROOT_DIR -Package
      - uses: actions/upload-artifact@v4
        with:
          name: search-windows-x64
          path: |
            build/qt-sdk-release/packages/*.zip
            build/qt-sdk-release/packages/update.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: search-windows-x64
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          name: search ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            packages/*.zip
            packages/update.json
